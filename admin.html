<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0814">
<title>Xy · 空间站控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="config.js?v=1"></script>
<style>
:root{color-scheme:dark;--bg:#090711;--panel:rgba(23,17,39,.8);--line:rgba(255,255,255,.12);--pink:#ff3d91;--purple:#a66bff;--cyan:#53eaff;--muted:rgba(255,255,255,.55)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:"Plus Jakarta Sans","Noto Sans SC",sans-serif;background:radial-gradient(ellipse at 10% 0,rgba(255,61,145,.12),transparent 35%),radial-gradient(ellipse at 95% 70%,rgba(120,69,255,.15),transparent 35%),#090711;color:#fff;min-height:100vh;padding:20px 14px calc(35px + env(safe-area-inset-bottom))}
main{width:min(100%,560px);margin:auto;display:grid;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;box-shadow:0 15px 40px #0004}
header{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--purple));font-size:19px}.brand h1{font-size:17px}.brand p{font-size:10px;color:var(--muted);margin-top:4px}.pill{border:1px solid var(--line);background:#ffffff0c;color:#fff;border-radius:12px;padding:9px 11px;font-weight:700;font-size:11px}
section.panel{overflow:hidden}.section-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:transparent;color:#fff;border:0;padding:17px 18px;font:inherit;cursor:pointer}.section-head strong{font-size:13px;color:var(--cyan)}.section-head i:last-child{color:var(--muted);transition:transform .2s}.section-body{display:none;padding:0 16px 18px;gap:13px}.panel.open .section-body{display:grid}.panel.open .section-head i:last-child{transform:rotate(180deg)}.group{display:grid;gap:6px}.group label{font-size:11px;color:#ddd;font-weight:700}.hint{font-size:10px;color:var(--muted);font-weight:400}.input{width:100%;border:1px solid var(--line);border-radius:12px;background:#0005;color:#fff;padding:12px;font:13px inherit;outline:none;min-height:43px}.input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a66bff20}.subcard{border:1px solid #ffffff12;background:#ffffff06;border-radius:15px;padding:13px;display:grid;gap:12px}.subcard h3{font-size:12px}.actions{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;padding:10px;background:#171126e8;backdrop-filter:blur(20px);z-index:3}.btn{border:1px solid var(--line);border-radius:13px;padding:12px 13px;color:white;font-weight:800;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px}.primary{flex:2;border:0;background:linear-gradient(135deg,var(--pink),var(--purple))}.secondary{flex:1;background:#ffffff0d}.btn:disabled{opacity:.55;cursor:wait}.notice{font-size:11px;line-height:1.65;color:var(--muted);padding:13px 15px}.notice b{color:#fff}.login{position:fixed;inset:0;background:#090711ed;backdrop-filter:blur(22px);z-index:20;display:grid;place-items:center;padding:18px}.login.hidden{display:none}.login-card{width:min(100%,380px);padding:25px;border:1px solid var(--line);border-radius:24px;background:#171126;display:grid;gap:15px;text-align:center;box-shadow:0 25px 70px #0009}.login-icon{width:58px;height:58px;margin:auto;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));font-size:24px}.login-card h2{font-size:19px}.login-card p{font-size:11px;color:var(--muted)}.login-card .btn{width:100%}.toast{position:fixed;top:calc(15px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);opacity:0;z-index:40;pointer-events:none;background:#197c5c;padding:11px 16px;border-radius:20px;font-size:12px;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.preview{position:fixed;inset:0;z-index:15;background:#000d;display:none;place-items:center;padding:12px}.preview.show{display:grid}.preview-inner{width:min(100%,470px);height:min(90dvh,900px);position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#090711}.preview iframe{width:100%;height:100%;border:0}.close{position:absolute;right:10px;top:10px;z-index:2;border-radius:50%;width:38px;height:38px;background:#000b;color:#fff;border:1px solid #ffffff30}
</style>
</head>
<body>
<main>
<header class="panel"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-satellite-dish"></i></div><div><h1>Xy · 星轨控制台</h1><p>个人空间站配置管理</p></div></div><button class="pill" id="lockBtn" type="button"><i class="fa-solid fa-lock"></i> 锁定</button></header>
<div class="panel notice"><b>安全提示：</b>此后台不会在网页中保存 GitHub Token。发布功能需要配置 Cloudflare Worker，并在 Worker 环境变量中设置密码和 GitHub Token；尚未配置时，你仍可预览并下载 config.js。</div>
<section class="panel open" id="profile"><button class="section-head" type="button"><strong><i class="fa-solid fa-user-gear"></i> 个人基本信息</strong><i class="fa-solid fa-chevron-down"></i></button><div class="section-body">
<div class="group"><label for="avatarUrl">头像 URL</label><input class="input" id="avatarUrl" placeholder="https://..."></div>
<div class="group"><label for="userNameMain">英文名称 / 主称</label><input class="input" id="userNameMain" placeholder="Xy"></div>
<div class="group"><label for="userNameSub">中文称号 / 副标题</label><input class="input" id="userNameSub" placeholder="个人空间站"></div>
</div></section>
<section class="panel" id="social"><button class="section-head" type="button"><strong><i class="fa-solid fa-paper-plane"></i> 联系方式</strong><i class="fa-solid fa-chevron-down"></i></button><div class="section-body">
<div class="subcard"><h3><i class="fa-brands fa-telegram"></i> Telegram</h3><div class="group"><label for="tgUsername">用户名 <span class="hint">不带 @</span></label><input class="input" id="tgUsername" placeholder="your_username"></div></div>
<div class="subcard"><h3><i class="fa-solid fa-envelope"></i> 邮箱</h3><div class="group"><label for="emailAddress">邮箱地址</label><input class="input" id="emailAddress" type="email" placeholder="name@example.com"></div></div>
</div></section>
<section class="panel" id="tools"><button class="section-head" type="button"><strong><i class="fa-solid fa-toolbox"></i> 工具导航（2 项）</strong><i class="fa-solid fa-chevron-down"></i></button><div class="section-body">
<div class="subcard"><h3>工具一</h3><div class="group"><label for="tool1Icon">Font Awesome 图标类名</label><input class="input" id="tool1Icon" placeholder="fa-solid fa-wand-magic-sparkles"></div><div class="group"><label for="tool1Title">名称</label><input class="input" id="tool1Title"></div><div class="group"><label for="tool1Desc">描述</label><input class="input" id="tool1Desc"></div><div class="group"><label for="tool1Url">链接（仅 http/https）</label><input class="input" id="tool1Url" type="url" placeholder="https://..."></div></div>
<div class="subcard"><h3>工具二</h3><div class="group"><label for="tool2Icon">Font Awesome 图标类名</label><input class="input" id="tool2Icon" placeholder="fa-solid fa-code"></div><div class="group"><label for="tool2Title">名称</label><input class="input" id="tool2Title"></div><div class="group"><label for="tool2Desc">描述</label><input class="input" id="tool2Desc"></div><div class="group"><label for="tool2Url">链接（仅 http/https）</label><input class="input" id="tool2Url" type="url" placeholder="https://..."></div></div>
</div></section>
<section class="panel" id="donate"><button class="section-head" type="button"><strong><i class="fa-solid fa-coins"></i> USDT 打赏配置</strong><i class="fa-solid fa-chevron-down"></i></button><div class="section-body"><div class="group"><label for="usdtAddress">USDT（TRC20）地址</label><input class="input" id="usdtAddress" placeholder="请粘贴完整地址"></div><p class="hint">发布前请自行核对地址、网络和尾号。此页面不会验证链上地址有效性。</p></div></section>
<div class="actions panel"><button class="btn secondary" id="previewBtn" type="button"><i class="fa-solid fa-eye"></i> 预览</button><button class="btn secondary" id="downloadBtn" type="button"><i class="fa-solid fa-download"></i> 导出配置</button><button class="btn primary" id="publishBtn" type="button"><i class="fa-solid fa-cloud-arrow-up"></i> 发布</button></div>
</main>
<div class="login" id="login"><div class="login-card"><div class="login-icon"><i class="fa-solid fa-shield-halved"></i></div><h2>后台安全验证</h2><p>输入管理密码解锁本次编辑会话</p><input class="input" id="password" type="password" autocomplete="current-password" placeholder="管理密码"><button class="btn primary" id="loginBtn" type="button"><i class="fa-solid fa-unlock"></i> 解锁控制台</button><p id="loginHint">若已部署安全 Worker，将在线验证密码。</p></div></div>
<div class="preview" id="preview"><div class="preview-inner"><button class="close" id="closePreview" type="button" aria-label="关闭预览"><i class="fa-solid fa-xmark"></i></button><iframe id="previewFrame" title="前台预览"></iframe></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
 const $=id=>document.getElementById(id);
 const keys=["avatarUrl","userNameMain","userNameSub","tgUsername","emailAddress","tool1Icon","tool1Title","tool1Desc","tool1Url","tool2Icon","tool2Title","tool2Desc","tool2Url","usdtAddress"];
 const defaults={avatarUrl:"",userNameMain:"Xy",userNameSub:"个人空间站",tgUsername:"",emailAddress:"",tool1Icon:"fa-solid fa-wand-magic-sparkles",tool1Title:"工具一",tool1Desc:"自定义工具介绍",tool1Url:"",tool2Icon:"fa-solid fa-code",tool2Title:"工具二",tool2Desc:"自定义工具介绍",tool2Url:"",usdtAddress:""};
 const cfg=Object.assign({},defaults,window.SITE_CONFIG||{});
 keys.forEach(k=>$(k).value=cfg[k]||"");
 document.querySelectorAll(".section-head").forEach(b=>b.addEventListener("click",()=>b.closest(".panel").classList.toggle("open")));
 const toast=msg=>{ $("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),2800)};
 const worker=()=>localStorage.getItem("XY_WORKER_URL")||"";
 const getData=()=>Object.fromEntries(keys.map(k=>[k,$(k).value.trim()]));
 const validUrl=(s,optional=true)=>{if(!s&&optional)return true;try{return ["http:","https:"].includes(new URL(s).protocol)}catch{return false}};
 function validate(d){if(d.avatarUrl&&!validUrl(d.avatarUrl))return "头像必须是 http/https 链接";for(const k of ["tool1Url","tool2Url"])if(d[k]&&!validUrl(d[k]))return "工具链接必须使用 http/https";if(d.emailAddress&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.emailAddress))return "请检查邮箱格式";if(d.tgUsername&&!/^[A-Za-z0-9_]{5,32}$/.test(d.tgUsername.replace(/^@/,"")))return "请检查 Telegram 用户名格式";return ""}
 function configSource(d){return "window.SITE_CONFIG = "+JSON.stringify(d,null,4)+";\n"}
 function download(){const blob=new Blob([configSource(getData())],{type:"text/javascript;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="config.js";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("已导出 config.js，请上传覆盖仓库中的同名文件")}
 $("downloadBtn").addEventListener("click",()=>{const e=validate(getData());if(e)return toast(e);download()});
 $("previewBtn").addEventListener("click",()=>{const e=validate(getData());if(e)return toast(e);const d=getData();const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#090711;color:#fff;font:14px sans-serif;padding:20px}main{max-width:400px;margin:auto}img{width:90px;height:90px;border-radius:50%;object-fit:cover}a{color:#9edcff;display:block;padding:12px;background:#ffffff10;border-radius:12px;margin:10px 0;text-decoration:none}small{color:#aaa}</style></head><body><main><img src="${d.avatarUrl.replace(/"/g,"&quot;")}" onerror="this.style.display='none'"><h1>${escapeHtml(d.userNameMain)} <small>// ${escapeHtml(d.userNameSub)}</small></h1><p>预览模式 · 星辰大海，寻找自己的轨道。</p>${d.tgUsername?`<a href="https://t.me/${encodeURIComponent(d.tgUsername.replace(/^@/,""))}">Telegram · @${escapeHtml(d.tgUsername)}</a>`:""}${d.emailAddress?`<a href="mailto:${escapeHtml(d.emailAddress)}">联系邮箱 · ${escapeHtml(d.emailAddress)}</a>`:""}${[1,2].map(n=>d[`tool${n}Title`]?`<a href="${validUrl(d[`tool${n}Url`])?d[`tool${n}Url`]:"#"}">${escapeHtml(d[`tool${n}Title`])}<br><small>${escapeHtml(d[`tool${n}Desc`])}</small></a>`:"").join("")}<p><small>USDT · ${escapeHtml(d.usdtAddress?d.usdtAddress.slice(0,8)+"••••"+d.usdtAddress.slice(-8):"未设置")}</small></p></main></body></html>`;$("previewFrame").srcdoc=html;$("preview").classList.add("show")});
 function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
 $("closePreview").addEventListener("click",()=>$("preview").classList.remove("show"));
 $("loginBtn").addEventListener("click",unlock);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
 async function unlock(){const pw=$("password").value;if(!pw)return toast("请输入管理密码");const url=worker();if(url){try{const r=await fetch(url.replace(/\/$/,"")+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});if(!r.ok)throw Error("密码验证失败");const d=await r.json();if(!d.ok)throw Error("密码错误");sessionStorage.setItem("xy_admin_ok","1");sessionStorage.setItem("xy_admin_pw",pw);$("login").classList.add("hidden");$("password").value="";toast("验证成功")}catch(e){toast(e.message||"无法连接安全服务");}}else{const local=prompt("尚未设置安全 Worker。此模式仅用于本地预览，不会启用云端发布。请输入临时预览密码：");if(local!==null){sessionStorage.setItem("xy_admin_ok","1");$("login").classList.add("hidden");$("password").value="";$("publishBtn").disabled=true;$("publishBtn").title="请先配置 Worker";toast("已进入本地预览模式，云端发布未启用")}}}
 function lock(){sessionStorage.removeItem("xy_admin_ok");sessionStorage.removeItem("xy_admin_pw");$("login").classList.remove("hidden");$("password").value=""}
 $("lockBtn").addEventListener("click",lock);
 if(sessionStorage.getItem("xy_admin_ok")==="1")$("login").classList.add("hidden");
 $("publishBtn").addEventListener("click",async()=>{const e=validate(getData());if(e)return toast(e);const url=worker();if(!url)return toast("未配置 Worker：请先导出 config.js 并手动上传");const pw=sessionStorage.getItem("xy_admin_pw");if(!pw)return toast("请重新登录");const b=$("publishBtn");b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 发布中';try{const r=await fetch(url.replace(/\/$/,"")+"/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,config:getData()})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw Error(data.error||"发布失败");toast("发布成功，等待静态站点刷新");}catch(err){toast(err.message||"发布失败，请检查 Worker 配置")}finally{b.disabled=false;b.innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> 发布'}});
 // Configure worker URL once in this browser: admin.html?worker=https%3A%2F%2Fyour-worker.example.workers.dev
 const p=new URLSearchParams(location.search).get("worker");if(p&&validUrl(p,false)){localStorage.setItem("XY_WORKER_URL",p);$("loginHint").textContent="已读取本次链接提供的安全服务地址。"}
})();
</script>
</body></html>
