<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Xy </title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 动态载入当前云端数据 -->
    <script>
        document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');
    </script>

    <style>
        :root {
            --bg-base: #0a0814;
            --accent-purple: #9d4edd;
            --accent-pink: #ff2a85;
            --accent-cyan: #00f0ff;
            --usdt-green: #26A17B;
            --glass-bg: rgba(22, 16, 38, 0.7);
            --glass-card: rgba(30, 22, 54, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            padding: 24px 16px 60px;
        }

        #nebula-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 登录锁屏遮罩层 */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 8, 20, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            margin: 0 auto;
            box-shadow: 0 8px 20px rgba(255, 42, 133, 0.4);
        }

        .login-title h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .login-title p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .admin-container {
            width: 100%;
            max-width: 520px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: pageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 42, 133, 0.4);
        }

        .header-text h1 {
            font-size: 18px;
            font-weight: 800;
        }

        .header-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .logout-btn {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:active { background: rgba(255, 77, 77, 0.3); }

        .form-section {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            transition: all 0.3s ease;
        }

        .section-header {
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
        }

        .section-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapse-icon {
            font-size: 13px;
            color: var(--text-muted);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .section-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-section.open .section-body {
            max-height: 1200px;
            padding: 0 20px 22px 20px;
        }

        .form-section.open .collapse-icon {
            transform: rotate(180deg);
            color: var(--accent-cyan);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-label span.sub {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.25s;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.35);
            background: rgba(0, 0, 0, 0.5);
        }

        .sub-card {
            background: var(--glass-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sub-card-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bottom-actions {
            position: sticky;
            bottom: 16px;
            z-index: 10;
            background: rgba(18, 12, 34, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .btn-primary {
            flex: 2;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(255, 42, 133, 0.35);
            transition: all 0.2s;
        }

        .btn-primary:active { transform: scale(0.96); }

        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .preview-modal.show { opacity: 1; pointer-events: auto; }

        .preview-iframe-wrapper {
            width: 100%;
            max-width: 420px;
            height: 90vh;
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            position: relative;
            background: #0a0814;
        }

        .preview-iframe { width: 100%; height: 100%; border: none; }

        .close-modal-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(38, 161, 123, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <canvas id="nebula-canvas"></canvas>

    <!-- 登录安全验证弹窗 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="login-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="login-title">
                <h2>后台安全锁</h2>
                <p>请输入管理密码以进入后台</p>
            </div>
            <div class="form-group" style="text-align: left;">
                <input type="password" id="loginPasswordInput" class="form-input" placeholder="请输入密码" style="text-align: center; font-size: 16px; letter-spacing: 2px;">
            </div>
            <button class="btn-primary" onclick="handleAuth()" style="width: 100%; padding: 14px;">
                <i class="fa-solid fa-unlock"></i> 解锁控制台
            </button>
        </div>
    </div>

    <div class="admin-container">
        
        <header class="admin-header">
            <div class="header-title-box">
                <div class="header-icon">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div class="header-text">
                    <h1>星轨控制台</h1>
                    <p>全网秒级自动同步后台</p>
                </div>
            </div>
            <button class="logout-btn" onclick="lockAdmin()"><i class="fa-solid fa-lock"></i> 锁定</button>
        </header>

        <!-- 1. 个人基本信息 -->
        <section class="form-section open" id="section-profile">
            <div class="section-header" onclick="toggleSection('section-profile')">
                <div class="section-title">
                    <i class="fa-solid fa-user-gear"></i> 个人基本信息
                </div>
                <i class="fa-solid fa-chevron-down collapse-icon"></i>
            </div>
            <div class="section-body">
                <div class="form-group">
                    <label class="form-label">网络头像 URL</label>
                    <input type="text" id="avatarUrl" class="form-input" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label class="form-label">英文名称 / 主称</label>
                    <input type="text" id="userNameMain" class="form-input" placeholder="例: KIRA">
                </div>
                <div class="form-group">
                    <label class="form-label">中文称号 / 副标题</label>
                    <input type="text" id="userNameSub" class="form-input" placeholder="例: 雲川">
                </div>
            </div>
        </section>

        <!-- 2. 联系方式配置 -->
        <section class="form-section" id="section-social">
            <div class="section-header" onclick="toggleSection('section-social')">
                <div class="section-title">
                    <i class="fa-solid fa-paper-plane"></i> 联系方式配置
                </div>
                <i class="fa-solid fa-chevron-down collapse-icon"></i>
            </div>
            <div class="section-body">
                <div class="sub-card">
                    <div class="sub-card-header"><i class="fa-brands fa-telegram" style="color:#2AABEE;"></i> Telegram</div>
                    <div class="form-group">
                        <label class="form-label">TG 用户名 <span class="sub">无需带 @</span></label>
                        <input type="text" id="tgUsername" class="form-input" placeholder="your_username">
                    </div>
                </div>
                <div class="sub-card">
                    <div class="sub-card-header"><i class="fa-solid fa-envelope" style="color:#FF416C;"></i> 电子邮箱</div>
                    <div class="form-group">
                        <label class="form-label">邮箱地址</label>
                        <input type="email" id="emailAddress" class="form-input" placeholder="example@gmail.com">
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. 工具列表配置 -->
        <section class="form-section" id="section-tools">
            <div class="section-header" onclick="toggleSection('section-tools')">
                <div class="section-title">
                    <i class="fa-solid fa-toolbox"></i> 自定义工具卡片 (2条)
                </div>
                <i class="fa-solid fa-chevron-down collapse-icon"></i>
            </div>
            <div class="section-body">
                <div class="sub-card">
                    <div class="sub-card-header"><i class="fa-solid fa-cube" style="color:var(--accent-pink);"></i> 工具一</div>
                    <div class="form-group">
                        <label class="form-label">图标</label>
                        <input type="text" id="tool1Icon" class="form-input" placeholder="fa-solid fa-wand-magic-sparkles">
                    </div>
                    <div class="form-group">
                        <label class="form-label">名称</label>
                        <input type="text" id="tool1Title" class="form-input" placeholder="名称">
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <input type="text" id="tool1Desc" class="form-input" placeholder="描述">
                    </div>
                    <div class="form-group">
                        <label class="form-label">链接</label>
                        <input type="text" id="tool1Url" class="form-input" placeholder="https://...">
                    </div>
                </div>

                <div class="sub-card">
                    <div class="sub-card-header"><i class="fa-solid fa-cube" style="color:var(--accent-cyan);"></i> 工具二</div>
                    <div class="form-group">
                        <label class="form-label">图标</label>
                        <input type="text" id="tool2Icon" class="form-input" placeholder="fa-solid fa-code">
                    </div>
                    <div class="form-group">
                        <label class="form-label">名称</label>
                        <input type="text" id="tool2Title" class="form-input" placeholder="名称">
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <input type="text" id="tool2Desc" class="form-input" placeholder="描述">
                    </div>
                    <div class="form-group">
                        <label class="form-label">链接</label>
                        <input type="text" id="tool2Url" class="form-input" placeholder="https://...">
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. 打赏配置 -->
        <section class="form-section" id="section-donate">
            <div class="section-header" onclick="toggleSection('section-donate')">
                <div class="section-title">
                    <i class="fa-solid fa-coins" style="color: var(--usdt-green);"></i> 加密打赏配置
                </div>
                <i class="fa-solid fa-chevron-down collapse-icon"></i>
            </div>
            <div class="section-body">
                <div class="form-group">
                    <label class="form-label">USDT (TRC20) 完整打赏地址</label>
                    <input type="text" id="usdtAddress" class="form-input" placeholder="TY8x9KmLpQv2sWnE4R7tY1uI3oP5aS6dF0">
                </div>
            </div>
        </section>

        <div class="bottom-actions">
            <button class="btn-secondary" onclick="openPreview()"><i class="fa-solid fa-eye"></i> 预览</button>
            <button class="btn-primary" id="saveBtn" onclick="syncToGitHub()"><i class="fa-solid fa-cloud-arrow-up"></i> 保存并发布全网</button>
        </div>

    </div>

    <div class="preview-modal" id="previewModal">
        <div class="preview-iframe-wrapper">
            <button class="close-modal-btn" onclick="closePreview()"><i class="fa-solid fa-xmark"></i></button>
            <iframe id="previewIframe" class="preview-iframe" src="index.html"></iframe>
        </div>
    </div>

    <div class="toast" id="toast">同步成功！</div>

    <script>
        /* ==================== 固化配置区 ==================== */
        // 在这里直接修改你的仓库路径、Token 和 管理员密码
        const HARDCODED_REPO = "Yukecil/zy";
        const HARDCODED_TOKEN = "你的ghp_开头的Token粘在这里"; 
        const HARDCODED_PASSWORD = "888888"; // <--- 在这里修改你的后台管理密码
        // ====================================================

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('admin_logged_in') === 'true') {
                document.getElementById('loginOverlay').classList.add('hidden');
            }
        });

        function handleAuth() {
            const inputVal = document.getElementById('loginPasswordInput').value.trim();
            if (inputVal === HARDCODED_PASSWORD) {
                sessionStorage.setItem('admin_logged_in', 'true');
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('loginPasswordInput').value = '';
            } else {
                alert('密码错误，请重新输入！');
                document.getElementById('loginPasswordInput').value = '';
            }
        }

        document.getElementById('loginPasswordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleAuth();
        });

        function lockAdmin() {
            sessionStorage.removeItem('admin_logged_in');
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('loginPasswordInput').value = '';
        }

        function toggleSection(sectionId) {
            document.getElementById(sectionId).classList.toggle('open');
        }

        function loadConfig() {
            const config = window.SITE_CONFIG || {};
            document.getElementById('avatarUrl').value = config.avatarUrl || '';
            document.getElementById('userNameMain').value = config.userNameMain || '';
            document.getElementById('userNameSub').value = config.userNameSub || '';
            document.getElementById('tgUsername').value = config.tgUsername || '';
            document.getElementById('emailAddress').value = config.emailAddress || '';
            
            document.getElementById('tool1Icon').value = config.tool1Icon || '';
            document.getElementById('tool1Title').value = config.tool1Title || '';
            document.getElementById('tool1Desc').value = config.tool1Desc || '';
            document.getElementById('tool1Url').value = config.tool1Url || '';

            document.getElementById('tool2Icon').value = config.tool2Icon || '';
            document.getElementById('tool2Title').value = config.tool2Title || '';
            document.getElementById('tool2Desc').value = config.tool2Desc || '';
            document.getElementById('tool2Url').value = config.tool2Url || '';

            document.getElementById('usdtAddress').value = config.usdtAddress || '';
        }

        async function syncToGitHub() {
            const repo = HARDCODED_REPO;
            const token = HARDCODED_TOKEN;

            if (!token || token.includes("你的ghp")) {
                alert('请先在 admin.html 代码上方的 HARDCODED_TOKEN 中填入你的 GitHub Token！');
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在发布全网...`;

            const configData = {
                avatarUrl: document.getElementById('avatarUrl').value,
                userNameMain: document.getElementById('userNameMain').value,
                userNameSub: document.getElementById('userNameSub').value,
                tgUsername: document.getElementById('tgUsername').value,
                emailAddress: document.getElementById('emailAddress').value,
                tool1Icon: document.getElementById('tool1Icon').value,
                tool1Title: document.getElementById('tool1Title').value,
                tool1Desc: document.getElementById('tool1Desc').value,
                tool1Url: document.getElementById('tool1Url').value,
                tool2Icon: document.getElementById('tool2Icon').value,
                tool2Title: document.getElementById('tool2Title').value,
                tool2Desc: document.getElementById('tool2Desc').value,
                tool2Url: document.getElementById('tool2Url').value,
                usdtAddress: document.getElementById('usdtAddress').value
            };

            const fileContent = "window.SITE_CONFIG = " + JSON.stringify(configData, null, 4) + ";";

            try {
                const getFileUrl = `https://api.github.com/repos/${repo}/contents/config.js`;
                const getRes = await fetch(getFileUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });

                let sha = "";
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const bytes = new TextEncoder().encode(fileContent);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64Content = btoa(binary);

                const putRes = await fetch(getFileUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'auto: update site config via admin panel',
                        content: base64Content,
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) {
                    showToast("🎉 发布成功！全网约 30 秒内同步完成。");
                } else {
                    const errErr = await putRes.json();
                    alert("发布失败: " + (errErr.message || "请检查 Token 权限和仓库名"));
                }
            } catch (err) {
                alert("网络连接出错: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> 保存并发布全网`;
            }
        }

        function openPreview() {
            const iframe = document.getElementById('previewIframe');
            iframe.src = 'index.html?t=' + Date.now();
            document.getElementById('previewModal').classList.add('show');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('show');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        loadConfig();

        // Canvas 背景
        const canvas = document.getElementById('nebula-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.7 + 0.2;
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha += Math.sin(Date.now() * this.pulseSpeed) * 0.01;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180, 150, 255, ${Math.max(0.1, Math.min(1, this.alpha))})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(157, 78, 221, 0.8)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particles.push(new Particle());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();
    </script>
</body>
</html>
