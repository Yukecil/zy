<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0814">
<title>Xy · 个人空间站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="config.js?v=1"></script>
<style>
:root{color-scheme:dark;--bg:#090711;--panel:rgba(23,17,39,.72);--line:rgba(255,255,255,.12);--pink:#ff3d91;--purple:#a66bff;--cyan:#53eaff;--green:#26a17b;--white:#fff;--muted:rgba(255,255,255,.58)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Plus Jakarta Sans","Noto Sans SC",sans-serif;background:var(--bg);color:var(--white);min-height:100vh;padding:28px 16px calc(34px + env(safe-area-inset-bottom));overflow-x:hidden}
#nebula{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 10% 12%,rgba(255,61,145,.13),transparent 34%),radial-gradient(ellipse at 90% 72%,rgba(120,69,255,.16),transparent 38%),linear-gradient(180deg,rgba(9,7,17,.15),#090711 88%)}
main{width:min(100%,460px);margin:auto;display:grid;gap:16px;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.06)}
.profile{position:relative;text-align:center;padding:30px 20px 22px;border-radius:30px;overflow:hidden}
.profile:before{content:"";position:absolute;inset:0 0 auto;height:150px;background:radial-gradient(ellipse at 50% 0,rgba(166,107,255,.2),transparent 72%);pointer-events:none}
.avatar-wrap{position:relative;width:100px;height:100px;margin:0 auto 17px}
.avatar-wrap:before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--pink),var(--purple),var(--cyan),var(--pink));filter:blur(7px);opacity:.75}
.avatar{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);background:#1b1530}
.status{position:absolute;right:-7px;bottom:2px;background:linear-gradient(135deg,var(--pink),var(--purple));border:2px solid #171126;border-radius:12px;padding:4px 8px;font-size:9px;font-weight:800;letter-spacing:1px}
.name{position:relative;font-size:25px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.name .main-name{background:linear-gradient(110deg,#fff 25%,#d9c2ff 65%,var(--pink));color:transparent;background-clip:text;-webkit-background-clip:text}
.slash{font-size:12px;color:var(--cyan);opacity:.8}
.quote{position:relative;min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px 15px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.045);font-size:13px;line-height:1.7;color:rgba(255,255,255,.88)}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:0 0 10px 3px}
.socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.social{min-width:0;display:flex;align-items:center;gap:11px;padding:14px 12px;border-radius:19px;text-decoration:none;color:white;transition:transform .2s,border-color .2s}
.social:active,.tool:active{transform:scale(.98)}
.iconbox{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:var(--icon-bg)}
.meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.label{font-size:12px;font-weight:800}.sub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}
.tools{display:grid;gap:12px}
.tool{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;text-decoration:none;color:white;transition:transform .2s,border-color .2s}
.tool-icon{width:48px;height:48px;flex:0 0 48px;border-radius:16px;display:grid;place-items:center;font-size:21px;background:var(--icon-bg)}
.tool-copy{min-width:0;flex:1}.tool-title{font-size:14px;font-weight:800;margin-bottom:5px;overflow-wrap:anywhere}.tool-desc{font-size:11px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}.arrow{color:var(--muted);font-size:12px}
.donate{display:flex;align-items:center;gap:12px;padding:15px;border-radius:20px}
.coin{width:43px;height:43px;flex:0 0 43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2fc99b,#176a52);font-size:19px}
.donate-info{min-width:0;flex:1}.donate-title{font-size:12px;font-weight:800;margin-bottom:7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.warning{font-size:9px;font-weight:700;color:#ff8e9b;background:rgba(255,77,100,.12);border:1px solid rgba(255,77,100,.22);border-radius:6px;padding:3px 5px}
.address{font:11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.2px;color:#d8fff2;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{border:1px solid rgba(38,161,123,.45);background:rgba(38,161,123,.15);color:#80f5cf;border-radius:12px;padding:10px 11px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}
footer{text-align:center;color:rgba(255,255,255,.34);font-size:10px;padding:5px 0 2px;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(26,133,98,.96);padding:11px 17px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 12px 30px #0008;transition:.25s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){body{padding-top:42px}.profile{padding-top:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="nebula" aria-hidden="true"></canvas><div class="ambient"></div>
<main>
<section class="profile panel">
  <div class="avatar-wrap"><img class="avatar" id="avatar" alt="个人头像" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231b1530'/%3E%3Ctext x='50' y='60' font-size='36' text-anchor='middle' fill='%23d9c2ff'%3EX%3C/text%3E%3C/svg%3E"><span class="status">ONLINE</span></div>
  <h1 class="name"><span class="main-name" id="userNameMain">Xy</span><span class="slash">//</span><span id="userNameSub">个人空间站</span></h1>
  <div class="quote" id="quote">在星辰大海之间，寻找属于自己的轨道。</div>
</section>
<section><p class="eyebrow">CONNECT WITH ME</p><div class="socials">
<a class="social panel" id="tgLink" href="#" target="_blank" rel="noopener noreferrer"><span class="iconbox" style="--icon-bg:linear-gradient(135deg,#2aabee,#1677c8)"><i class="fa-brands fa-telegram"></i></span><span class="meta"><span class="label">Telegram</span><span class="sub" id="tgText">尚未设置</span></span></a>
<a class="social panel" id="emailLink" href="#"><span class="iconbox" style="--icon-bg:linear-gradient(135deg,#ff416c,#ff4b2b)"><i class="fa-solid fa-envelope"></i></span><span class="meta"><span class="label">联系邮箱</span><span class="sub" id="emailText">发送邮件</span></span></a>
</div></section>
<section><p class="eyebrow">TOOLS & LINKS</p><div class="tools">
<a class="tool panel" id="tool1" href="#" target="_blank" rel="noopener noreferrer"><span class="tool-icon" style="--icon-bg:linear-gradient(135deg,#ff2a85,#9d4edd)"><i id="tool1Icon" class="fa-solid fa-wand-magic-sparkles"></i></span><span class="tool-copy"><span class="tool-title" id="tool1Title">工具一</span><span class="tool-desc" id="tool1Desc">自定义工具介绍</span></span><i class="fa-solid fa-chevron-right arrow"></i></a>
<a class="tool panel" id="tool2" href="#" target="_blank" rel="noopener noreferrer"><span class="tool-icon" style="--icon-bg:linear-gradient(135deg,#00d9ff,#345cff)"><i id="tool2Icon" class="fa-solid fa-code"></i></span><span class="tool-copy"><span class="tool-title" id="tool2Title">工具二</span><span class="tool-desc" id="tool2Desc">自定义工具介绍</span></span><i class="fa-solid fa-chevron-right arrow"></i></a>
</div></section>
<section class="donate panel"><span class="coin"><i class="fa-solid fa-coins"></i></span><div class="donate-info"><div class="donate-title">USDT 打赏地址 <span class="warning">核对尾号 <b id="last5">-----</b></span></div><div class="address" id="address">暂未设置地址</div></div><button class="copy" id="copyBtn" type="button"><i class="fa-regular fa-copy"></i> 复制</button></section>
<footer id="footer">© <span id="year"></span> Xy · PERSONAL SPACE</footer>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const defaults = {userNameMain:"Xy",userNameSub:"个人空间站",avatarUrl:"",tgUsername:"",emailAddress:"",tool1Icon:"fa-solid fa-wand-magic-sparkles",tool1Title:"工具一",tool1Desc:"自定义工具介绍",tool1Url:"",tool2Icon:"fa-solid fa-code",tool2Title:"工具二",tool2Desc:"自定义工具介绍",tool2Url:"",usdtAddress:""};
 const cfg = Object.assign({}, defaults, window.SITE_CONFIG || {});
 const setText=(id,value)=>$(id).textContent=value || "";
 const safeWebUrl=value=>{try{const u=new URL(value);return ["https:","http:"].includes(u.protocol)?u.href:"#"}catch{return "#"}};
 if(cfg.avatarUrl){const img=$("avatar");img.src=safeWebUrl(cfg.avatarUrl);img.onerror=()=>{img.removeAttribute("src");img.alt="头像加载失败"}}
 setText("userNameMain",cfg.userNameMain);setText("userNameSub",cfg.userNameSub);
 if(cfg.tgUsername){const name=String(cfg.tgUsername).trim().replace(/^@/,"");$("tgLink").href="https://t.me/"+encodeURIComponent(name);setText("tgText","@"+name)}else{$("tgLink").hidden=true}
 if(cfg.emailAddress){$("emailLink").href="mailto:"+cfg.emailAddress;setText("emailText",cfg.emailAddress)}else{$("emailLink").hidden=true}
 for(let n=1;n<=2;n++){setText(`tool${n}Title`,cfg[`tool${n}Title`]);setText(`tool${n}Desc`,cfg[`tool${n}Desc`]);const icon=cfg[`tool${n}Icon`];if(icon)$(`tool${n}Icon`).className=icon;const url=safeWebUrl(cfg[`tool${n}Url`]);$(`tool${n}`).href=url;if(url==="#"){$(`tool${n}`).removeAttribute("target");$(`tool${n}`).style.opacity=".72"}}
 const addr=String(cfg.usdtAddress||"").trim();setText("address",addr?addr.slice(0,8)+"••••"+addr.slice(-8):"暂未设置地址");setText("last5",addr?addr.slice(-5):"-----");$("copyBtn").disabled=!addr;
 $("year").textContent=new Date().getFullYear();
 const toast=msg=>{setText("toast",msg);$("toast").classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").classList.remove("show"),2400)};
 $("copyBtn").addEventListener("click",async()=>{if(!addr)return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(addr);else{const el=document.createElement("textarea");el.value=addr;el.style.position="fixed";el.style.opacity="0";document.body.appendChild(el);el.select();if(!document.execCommand("copy"))throw Error("copy failed");el.remove()}toast("地址已复制，请核对网络和尾号")}catch{toast("复制失败，请长按地址手动复制")}});
 const q=$("quote"),fallback="在星辰大海之间，寻找属于自己的轨道。";
 async function getQuote(){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),3000);const r=await fetch("https://v1.hitokoto.cn",{signal:c.signal,cache:"no-store"});clearTimeout(t);if(!r.ok)throw 0;const d=await r.json();q.textContent=d.hitokoto||fallback}catch{q.textContent=fallback}}
 getQuote();
 // Lightweight canvas animation; pause when the page is hidden.
 const canvas=$("nebula"),ctx=canvas.getContext("2d");let w=0,h=0,dpr=1,particles=[],raf=0;
 function resize(){dpr=Math.min(window.devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+"px";canvas.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.min(55,Math.floor(w*h/18000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.4,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,a:Math.random()*.55+.15}))}
 function draw(){ctx.clearRect(0,0,w,h);for(const p of particles){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(190,160,255,${p.a})`;ctx.fill()}raf=requestAnimationFrame(draw)}
 resize();draw();addEventListener("resize",resize,{passive:true});document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else draw()});
})();
</script>
</body></html>
